<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingChatKuy</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0d0e15;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }

        /* Header */
        header {
            background: rgba(20, 21, 33, 0.7);
            backdrop-filter: blur(12px);
            padding: 15px 20px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            z-index: 10;
        }

        header h1 {
            font-size: 1.2rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            background: linear-gradient(135deg, #a78bfa, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Chat Container */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            scroll-behavior: smooth;
        }

        /* Bubble Chat */
        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 16px;
            font-size: 0.95rem;
            line-height: 1.4;
            animation: fadeIn 0.3s ease-out;
            word-wrap: break-word;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            background: rgba(30, 32, 48, 0.8);
            backdrop-filter: blur(8px);
            color: #e2e8f0;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .message.user {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3);
        }

        .message.loading {
            font-style: italic;
            color: #94a3b8;
        }

        /* Input Area */
        .input-container {
            padding: 15px 20px;
            background: rgba(20, 21, 33, 0.8);
            backdrop-filter: blur(12px);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }

        .input-container input {
            flex: 1;
            padding: 12px 18px;
            background: rgba(15, 17, 26, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 50px;
            color: #ffffff;
            font-size: 0.95rem;
            outline: none;
            transition: all 0.3s ease;
        }

        .input-container input:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        .input-container button {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border: none;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s ease, opacity 0.2s ease;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
        }

        .input-container button:active {
            transform: scale(0.92);
        }

        .input-container button svg {
            width: 20px;
            height: 20px;
            fill: #ffffff;
            transform: translateX(1px);
        }
    </style>
</head>
<body>

    <header>
        <h1>PingChatKuy</h1>
    </header>

    <div class="chat-container" id="chatContainer">
        <div class="message bot">Halo! Selamat datang di <strong>PingChatKuy</strong>. Ada yang bisa aku bantu hari ini?</div>
    </div>

    <div class="input-container">
        <input type="text" id="userInput" placeholder="Tulis pesanmu di sini..." autocomplete="off">
        <button id="sendButton">
            <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"></path>
            </svg>
        </button>
    </div>

    <script>
        const chatContainer = document.getElementById('chatContainer');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        function appendMessage(text, sender) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatContainer.appendChild(messageDiv);
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return messageDiv;
        }

        async function handleSendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            // Tampilkan pesan user
            appendMessage(text, 'user');
            userInput.value = '';

            // Tampilkan indikator loading bot
            const loadingMessage = appendMessage('Sedang mengetik...', 'bot loading');

            try {
                // Request ke serverless function /api/chat
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ message: text })
                });

                const data = await response.json();

                // Hapus pesan loading
                chatContainer.removeChild(loadingMessage);

                if (response.ok && data.reply) {
                    appendMessage(data.reply, 'bot');
                } else {
                    appendMessage(data.reply || 'Gagal terhubung ke server PingChatKuy.', 'bot');
                }
            } catch (error) {
                console.error('Fetch error:', error);
                chatContainer.removeChild(loadingMessage);
                appendMessage('Gagal terhubung ke server PingChatKuy.', 'bot');
            }
        }

        sendButton.addEventListener('click', handleSendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                handleSendMessage();
            }
        });
    </script>
</body>
</html>
