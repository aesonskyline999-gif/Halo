<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PingChatKuy AI</title>
    <!-- Font Modern: Plus Jakarta Sans -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lenis Smooth Scroll CDN -->
    <script src="https://unpkg.com/@studio-freight/lenis@1.0.42/dist/lenis.min.js"></script>
    <style>
        :root {
            --bg-gradient: radial-gradient(circle at top left, #1e1b4b, #09090b 60%);
            --glass-bg: rgba(24, 24, 27, 0.65);
            --glass-border: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --primary-glow: rgba(99, 102, 241, 0.4);
            --user-msg: linear-gradient(135deg, #6366f1, #8b5cf6);
            --bot-msg: rgba(39, 39, 42, 0.8);
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Kontainer Utama dengan Efek Glassmorphism & Motion Masuk */
        .chat-container {
            width: 100%;
            max-width: 480px;
            height: 90vh;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            animation: containerAppear 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            overflow: hidden;
        }

        @keyframes containerAppear {
            0% { opacity: 0; transform: translateY(30px) scale(0.96); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Header */
        .chat-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(9, 9, 11, 0.4);
        }

        .bot-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .bot-avatar {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--user-msg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 16px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        .bot-details h2 {
            font-size: 16px;
            font-weight: 600;
        }

        .status {
            font-size: 12px;
            color: #34d399;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            background: #34d399;
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(1.3); }
        }

        /* Wrapper untuk Lenis Scroll */
        .chat-scroll-wrapper {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            position: relative;
        }

        /* Sembunyikan scrollbar bawaan agar bersih */
        .chat-scroll-wrapper::-webkit-scrollbar {
            width: 5px;
        }
        .chat-scroll-wrapper::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 10px;
        }

        .chat-messages {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        /* Bubble Pesan & Motion Animasi */
        .message {
            max-width: 82%;
            padding: 12px 16px;
            border-radius: 18px;
            font-size: 14px;
            line-height: 1.5;
            word-wrap: break-word;
            animation: messagePop 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            transform-origin: bottom;
        }

        @keyframes messagePop {
            0% { opacity: 0; transform: translateY(15px) scale(0.95); }
            100% { opacity: 1; transform: translateY(0) scale(1); }
        }

        .message.user {
            align-self: flex-end;
            background: var(--user-msg);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 8px 20px -6px var(--primary-glow);
        }

        .message.bot {
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            color: var(--text-main);
            border-bottom-left-radius: 4px;
        }

        /* Indikator Mengetik (Typing Motion) */
        .typing-indicator {
            display: none;
            align-self: flex-start;
            background: var(--bot-msg);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 18px;
            border-bottom-left-radius: 4px;
            gap: 5px;
            align-items: center;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: var(--text-muted);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        /* Area Input Bawah */
        .chat-input-area {
            padding: 16px 20px;
            border-top: 1px solid var(--glass-border);
            background: rgba(9, 9, 11, 0.5);
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .chat-input-area input {
            flex: 1;
            background: rgba(39, 39, 42, 0.7);
            border: 1px solid var(--glass-border);
            padding: 12px 16px;
            border-radius: 14px;
            color: white;
            font-size: 14px;
            outline: none;
            transition: all 0.25s ease;
        }

        .chat-input-area input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        .send-btn {
            background: var(--user-msg);
            border: none;
            width: 44px;
            height: 44px;
            border-radius: 14px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.2s ease;
        }

        .send-btn:hover {
            transform: scale(1.06);
            box-shadow: 0 0 18px var(--primary-glow);
        }

        .send-btn:active {
            transform: scale(0.94);
        }

        @media (max-width: 520px) {
            .chat-container {
                height: 100vh;
                border-radius: 0;
                border: none;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <!-- Header -->
    <div class="chat-header">
        <div class="bot-info">
            <div class="bot-avatar">PK</div>
            <div class="bot-details">
                <h2>PingChatKuy AI</h2>
                <div class="status"><span class="status-dot"></span> Online & Siap</div>
            </div>
        </div>
    </div>

    <!-- Area Chat dengan Lenis Smooth Scroll -->
    <div class="chat-scroll-wrapper" id="scroll-wrapper">
        <div class="chat-messages" id="chat-messages">
            <div class="message bot">
                Halo! Selamat datang di <b>PingChatKuy</b>. Ada yang bisa aku bantu hari ini?
            </div>
        </div>

        <!-- Animasi Typing -->
        <div class="typing-indicator" id="typing-indicator" style="margin-top: 14px;">
            <span></span><span></span><span></span>
        </div>
    </div>

    <!-- Form Input -->
    <form class="chat-input-area" id="chat-form">
        <input type="text" id="user-input" placeholder="Tulis pesanmu di sini..." autocomplete="off" required />
        <button type="submit" class="send-btn" aria-label="Kirim">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="22" y1="2" x2="11" y2="13"></line>
                <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
            </svg>
        </button>
    </form>
</div>

<script>
    // 1. Inisialisasi Lenis untuk Smooth Scroll di area chat
    const scrollWrapper = document.getElementById('scroll-wrapper');
    const lenis = new Lenis({
        wrapper: scrollWrapper,
        content: document.getElementById('chat-messages'),
        duration: 1.1,
        easing: (t) => Math.min(1, 1.001 - Math.pow(2, -10 * t)),
        smoothWheel: true
    });

    function raf(time) {
        lenis.raf(time);
        requestAnimationFrame(raf);
    }
    requestAnimationFrame(raf);

    // Fungsi scroll otomatis ke bawah dengan halus
    function scrollToBottom() {
        lenis.scrollTo('bottom', { duration: 0.8 });
    }

    // 2. Logika Interaksi Chat ke Backend (/api/chat)
    const chatForm = document.getElementById('chat-form');
    const userInput = document.getElementById('user-input');
    const chatMessages = document.getElementById('chat-messages');
    const typingIndicator = document.getElementById('typing-indicator');

    function appendMessage(text, sender) {
        const msgDiv = document.createElement('div');
        msgDiv.classList.add('message', sender);
        msgDiv.textContent = text;
        chatMessages.appendChild(msgDiv);
        scrollToBottom();
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = userInput.value.trim();
        if (!message) return;

        // Tampilkan pesan pengguna
        appendMessage(message, 'user');
        userInput.value = '';

        // Tampilkan indikator mengetik
        typingIndicator.style.display = 'flex';
        scrollToBottom();

        try {
            // Panggil endpoint backend Vercel (/api/chat) tanpa mengekspos API key
            const response = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message })
            });

            const data = await response.json();
            
            // Sembunyikan indikator mengetik & tampilkan balasan bot
            typingIndicator.style.display = 'none';
            
            if (response.ok && data.reply) {
                appendMessage(data.reply, 'bot');
            } else {
                appendMessage('Maaf, terjadi kendala saat memproses pesan.', 'bot');
            }
        } catch (error) {
            typingIndicator.style.display = 'none';
            appendMessage('Gagal terhubung ke server PingChatKuy.', 'bot');
        }
    });
</script>

</body>
</html>
